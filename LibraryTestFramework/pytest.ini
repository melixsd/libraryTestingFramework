[pytest]
pythonpath = .
testpaths = tests
markers =
    unit: Unit tests (mock repos, no database)
    integration: Integration tests (TestClient, in-memory DB)
    e2e: End-to-end Selenium tests (requires running servers)
    selenium: Selenium browser tests
addopts = -v --tb=short
    --cov=app --cov-report=term-missing
    --cov-report=json:coverage.json --cov-report=html
    --cov-fail-under=85