name: Automated Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare report directory
        run: mkdir -p tests/reports

      - name: Run unit and integration tests with coverage and JSON report
        run: |
          pytest tests/unit tests/integration \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:tests/reports/coverage \
            --json-report \
            --json-report-file=tests/reports/results.json \
            --html=tests/reports/report.html \
            --self-contained-html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: tests/reports/
          if-no-files-found: warn
          retention-days: 30

      # Browser E2E tests are intentionally run locally because they require
      # the frontend, backend, browser, and test data to be available together.
      # Run them locally with: pytest tests/e2e -m e2e
